<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var saved =
            localStorage.getItem('novum-index-theme-pref') ||
            localStorage.getItem('frontier-index-theme-pref');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <title>AI Systems &amp; Model Rankings — The Novum Index</title>
    <meta
      name="description"
      content="Metrics and rankings comparing which AI models, neural networks, neuro-symbolic provers, and classical symbolic AIs have produced the highest scientific impact and breakthrough volume (1976–2026)."
    />
