name: Submit a Breakthrough
description: Nominate an AI-assisted or AI-led scientific or mathematical breakthrough for The Novum Index
title: "[Nomination]: "
labels: ["nomination", "data"]
body:
  - type: input
    id: title
    attributes:
      label: Breakthrough Title
      placeholder: "e.g., Formal Lean Proof of ..."
    validations:
      required: true
  - type: dropdown
    id: discipline
    attributes:
      label: Primary Discipline
      options:
        - Mathematics
        - Computer Science & AI
        - Physics & Quantum
        - Biology & Medicine
        - Chemistry & Materials
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date Announced / Published (YYYY-MM-DD)
      placeholder: "2026-11-25"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Current Verification Status
      options:
        - Formally Verified
        - Peer-Reviewed
        - Preprint / Active Review
        - Contested / Partial
    validations:
      required: true
  - type: dropdown
    id: ai_role
    attributes:
      label: AI Role (AI-Assisted or Autonomous AI only)
      options:
        - Autonomous AI
        - AI-Assisted
    validations:
      required: true
  - type: input
    id: ai_system
    attributes:
      label: AI Model / System Used
      placeholder: "e.g., GPT-6.2 Astra + Lean 4, Claude Fable 5.2, Gemini 4 Carbon"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary Source URLs (arXiv, DOI, Lean/GitHub repo, X post, or official announcement)
      placeholder: "https://arxiv.org/abs/... or https://x.com/... or https://github.com/..."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why It Matters & Proposed Score Rationale
      description: Briefly summarize significance, caveats, and suggested scores across Foundational Depth, Cross-Field Ripple, Verification & Rigor, and Discovery Velocity.
    validations:
      required: true
