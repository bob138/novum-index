<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var saved =
            localStorage.getItem('novum-index-theme-pref') ||
            localStorage.getItem('frontier-index-theme-pref');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <title>The Novum Index — AI Scientific Breakthroughs &amp; Acceleration Curve</title>
    <meta
      name="description"
      content="An open-source interactive index tracking, verifying, and visualizing the exponential rate of AI-assisted and AI-led breakthroughs across Mathematics, Computer Science, Physics, Biology, and Chemistry."
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bob138.github.io/novum-index/" />
    <meta property="og:title" content="The Novum Index — AI Scientific Breakthroughs & Acceleration Curve" />
    <meta
      property="og:description"
      content="Tracking 132 AI-assisted and autonomous AI breakthroughs (1976–2026)—contrasting 50 years of pre-2020 pioneers against the exponential neural and neuro-symbolic surge."
    />
    <meta property="og:image" content="https://bob138.github.io/novum-index/og-card.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Novum Index — AI Scientific Breakthroughs" />
    <meta
      name="twitter:description"
      content="Tracking and visualizing the exponential growth of AI-assisted and AI-led breakthroughs across Mathematics, Computer Science, Physics, Biology, and Chemistry."
    />
    <meta name="twitter:image" content="https://bob138.github.io/novum-index/og-card.jpg" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
